[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++20
    -g3
    -fno-omit-frame-pointer
    -Wl,--build-id=sha1
    -Wl,-Map=firmware.map
    -DNEXUS_PLATFORM_ESP32=1
    -DNEXUS_AUTHORIZED_LAB_TARGET=0
    -DNEXUS_ACTIVE_FUZZ_ENABLED=0
    -DNEXUS_TARGET_DIAG_UART_ENABLED=0
    -DNEXUS_TARGET_COV_SYNC_ENABLED=0
    -DNEXUS_TARGET_DIAG_RX_PIN=16
    -DNEXUS_TARGET_DIAG_TX_PIN=15
    -DNEXUS_TARGET_DIAG_BAUD=115200
    -DNEXUS_TARGET_COV_WAIT_MS=100
    -DNEXUS_TARGET_SYNC_WAIT_MS=25
    -I include
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<engine.cpp> +<esp32s3_main.cpp>

; Raspberry Pi Pico / RP2040 using the Arduino-Pico (Earle Philhower) core.
; The fuzzer defaults to DISARMED on this target too.
[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++20
    -g3
    -fno-omit-frame-pointer
    -Wl,--build-id=sha1
    -Wl,-Map=firmware.map
    -DNEXUS_PLATFORM_RP2040=1
    -DNEXUS_AUTHORIZED_LAB_TARGET=0
    -DNEXUS_ACTIVE_FUZZ_ENABLED=0
    -DNEXUS_LINK_MODE=1
    -I include
monitor_speed = 115200
upload_protocol = picotool
build_src_filter = +<engine.cpp> +<rp2040_main.cpp>

; Debug-symbol builds for GDB/OpenOCD post-mortem and live capture.
; These environments still ship DISARMED. They do not flash automatically.
[env:esp32s3-debug]
extends = env:esp32s3
build_type = debug
build_flags = ${env:esp32s3.build_flags} -Og -g3 -fno-omit-frame-pointer

[env:rpipico-debug]
extends = env:rpipico
build_type = debug
build_flags = ${env:rpipico.build_flags} -Og -g3 -fno-omit-frame-pointer
